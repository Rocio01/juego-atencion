<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>

<div style="width:100%;height:100vh;min-height:600px;position:relative;overflow:hidden;background:{{ p.bg }};font-family:'Atkinson Hyperlegible',Helvetica,Arial,sans-serif;color:{{ p.text }};">

  <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
    <div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(20px,4vh,40px);padding:clamp(24px,5vw,48px);text-align:center;">
      <div style="font-size:clamp(34px,5.5vw,58px);font-weight:700;line-height:1.15;">Juego de Atención</div>
      <div style="font-size:clamp(24px,3vw,30px);max-width:620px;line-height:1.5;opacity:0.9;">Mira con calma lo que aparece en la pantalla. Luego contesta dos preguntas sencillas.</div>
      <button onClick="{{ startGame }}" style="margin-top:clamp(8px,2vh,16px);width:min(560px,90vw);min-height:100px;height:clamp(100px,14vh,140px);border-radius:28px;background:{{ p.primary }};color:{{ p.primaryText }};font-size:clamp(32px,4.5vw,46px);font-weight:700;border:none;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,0.18);" style-hover="filter:brightness(1.05);" style-active="transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,0.18);">Jugar</button>
    </div>
  </sc-if>

  <sc-if value="{{ isGame }}" hint-placeholder-val="{{ false }}">
    <div style="width:100%;height:100%;display:flex;flex-direction:column;">
      <div style="width:100%;min-height:64px;height:clamp(64px,9vh,80px);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,3vw,32px);flex-shrink:0;">
        <div style="display:flex;gap:clamp(6px,1vw,10px);align-items:center;">
          <sc-for list="{{ segments }}" as="seg" hint-placeholder-count="8">
            <div style="width:clamp(14px,1.8vw,20px);height:clamp(14px,1.8vw,20px);border-radius:50%;background:{{ seg.color }};border:2px solid {{ p.line }};"></div>
          </sc-for>
        </div>
        <button onClick="{{ pauseGame }}" style="min-height:64px;height:clamp(64px,8vh,76px);min-width:110px;padding:0 clamp(18px,2.5vw,28px);border-radius:20px;background:{{ p.bg2 }};border:3px solid {{ p.line }};color:{{ p.text }};font-size:clamp(22px,2.4vw,26px);font-weight:700;display:flex;align-items:center;gap:10px;cursor:pointer;" style-hover="filter:brightness(0.97);">
          <span style="display:flex;gap:5px;">
            <span style="width:6px;height:20px;background:{{ p.text }};border-radius:2px;"></span>
            <span style="width:6px;height:20px;background:{{ p.text }};border-radius:2px;"></span>
          </span>
          Pausa
        </button>
      </div>

      <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:clamp(12px,2vw,24px);">

        <sc-if value="{{ isStimOrBlank }}" hint-placeholder-val="{{ false }}">
          <div style="position:relative;width:min(70vw,70vh,600px);aspect-ratio:1;">
            <div style="position:absolute;inset:0;border-radius:50%;border:5px solid {{ p.line }};"></div>
            <div style="position:absolute;left:50%;top:0;bottom:0;width:3px;background:{{ p.line }};transform:translateX(-50%);opacity:0.5;"></div>
            <div style="position:absolute;left:50%;top:0;bottom:0;width:3px;background:{{ p.line }};transform:translateX(-50%) rotate(60deg);opacity:0.5;"></div>
            <div style="position:absolute;left:50%;top:0;bottom:0;width:3px;background:{{ p.line }};transform:translateX(-50%) rotate(120deg);opacity:0.5;"></div>
            <sc-if value="{{ isStimulus }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;left:{{ signalPos.left }}%;top:{{ signalPos.top }}%;width:clamp(46px,7vw,72px);height:clamp(46px,7vw,72px);background:{{ p.signal }};transform:translate(-50%,-50%) rotate(45deg);border-radius:8px;"></div>
            </sc-if>
            <sc-if value="{{ showCar }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(220px,28vw,300px);height:clamp(96px,12.5vw,132px);">
                <div style="position:absolute;left:2%;right:2%;bottom:22%;height:34%;background:{{ carColor }};border-radius:50% 16% 10px 10px;"></div>
                <div style="position:absolute;left:30%;right:12%;bottom:52%;height:30%;background:{{ carColor }};border-radius:60% 14% 0 0;"></div>
                <div style="position:absolute;left:37%;right:17%;bottom:58%;height:18%;background:{{ p.bg }};border-radius:50% 10% 0 0;"></div>
                <div style="position:absolute;left:58%;width:3px;bottom:58%;height:18%;background:{{ carColor }};"></div>
                <div style="position:absolute;left:0;width:7%;height:9%;bottom:30%;background:{{ p.bg }};border-radius:3px;opacity:0.9;"></div>
                <div style="position:absolute;right:0;width:5%;height:8%;bottom:31%;background:{{ p.line }};border-radius:3px;"></div>
                <div style="position:absolute;width:clamp(30px,4vw,42px);aspect-ratio:1;border-radius:50%;background:{{ p.text }};bottom:-14%;left:16%;display:flex;align-items:center;justify-content:center;">
                  <div style="width:40%;aspect-ratio:1;border-radius:50%;background:{{ p.bg }};"></div>
                </div>
                <div style="position:absolute;width:clamp(30px,4vw,42px);aspect-ratio:1;border-radius:50%;background:{{ p.text }};bottom:-14%;right:16%;display:flex;align-items:center;justify-content:center;">
                  <div style="width:40%;aspect-ratio:1;border-radius:50%;background:{{ p.bg }};"></div>
                </div>
              </div>
            </sc-if>
            <sc-if value="{{ showBird }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(190px,24vw,260px);height:clamp(150px,19vw,200px);">
                <div style="position:absolute;left:12%;right:28%;top:32%;bottom:8%;background:{{ birdColor }};border-radius:50% 50% 45% 45%;"></div>
                <div style="position:absolute;left:20%;top:40%;width:50%;height:34%;background:{{ birdColor }};opacity:0.55;border-radius:50% 50% 50% 15%;transform:rotate(-12deg);"></div>
                <div style="position:absolute;width:36%;aspect-ratio:1;background:{{ birdColor }};border-radius:50%;top:2%;right:6%;"></div>
                <div style="position:absolute;width:16%;height:12%;right:-8%;top:16%;background:{{ p.text }};clip-path:polygon(0 0,100% 50%,0 100%);"></div>
                <div style="position:absolute;width:9%;aspect-ratio:1;border-radius:50%;background:{{ p.text }};top:10%;right:18%;display:flex;align-items:center;justify-content:center;">
                  <div style="width:40%;aspect-ratio:1;border-radius:50%;background:{{ p.bg }};"></div>
                </div>
                <div style="position:absolute;width:22%;height:16%;left:-6%;bottom:22%;background:{{ birdColor }};clip-path:polygon(100% 0,0 50%,100% 100%);"></div>
              </div>
            </sc-if>
            <sc-if value="{{ showBoat }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(190px,24vw,260px);height:clamp(150px,19vw,200px);">
                <div style="position:absolute;left:10%;right:10%;bottom:8%;height:24%;background:{{ boatColor }};clip-path:polygon(12% 0%,88% 0%,72% 100%,28% 100%);"></div>
                <div style="position:absolute;left:47%;width:5%;bottom:30%;height:56%;background:{{ p.text }};border-radius:2px;"></div>
                <div style="position:absolute;left:50%;width:38%;bottom:32%;height:48%;background:{{ boatColor }};clip-path:polygon(0% 0%,100% 32%,0% 100%);"></div>
              </div>
            </sc-if>
          </div>
        </sc-if>

        <sc-if value="{{ isQ1 }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;flex-direction:column;align-items:center;gap:clamp(28px,5vh,48px);">
            <div style="font-size:clamp(28px,4vw,42px);font-weight:700;text-align:center;">{{ question1Text }}</div>
            <div style="display:flex;gap:clamp(24px,4vw,48px);flex-wrap:wrap;justify-content:center;">
              <sc-for list="{{ q1Options }}" as="opt" hint-placeholder-count="2">
                <button onClick="{{ opt.onClick }}" style="min-width:200px;width:clamp(200px,24vw,300px);min-height:220px;height:clamp(220px,26vw,300px);border-radius:28px;border:4px solid transparent;background:{{ p.bg2 }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,0.1);" style-hover="border-color:{{ p.primary }};">
                  <sc-if value="{{ opt.isCar }}" hint-placeholder-val="{{ false }}">
                    <div style="position:relative;width:clamp(170px,20vw,220px);height:clamp(76px,10vw,100px);">
                      <div style="position:absolute;left:2%;right:2%;bottom:22%;height:34%;background:{{ opt.color }};border-radius:50% 16% 10px 10px;"></div>
                      <div style="position:absolute;left:30%;right:12%;bottom:52%;height:30%;background:{{ opt.color }};border-radius:60% 14% 0 0;"></div>
                      <div style="position:absolute;left:37%;right:17%;bottom:58%;height:18%;background:{{ p.bg2 }};border-radius:50% 10% 0 0;"></div>
                      <div style="position:absolute;left:58%;width:3px;bottom:58%;height:18%;background:{{ opt.color }};"></div>
                      <div style="position:absolute;left:0;width:7%;height:9%;bottom:30%;background:{{ p.bg2 }};border-radius:3px;opacity:0.9;"></div>
                      <div style="position:absolute;right:0;width:5%;height:8%;bottom:31%;background:{{ p.line }};border-radius:3px;"></div>
                      <div style="position:absolute;width:clamp(24px,3.2vw,34px);aspect-ratio:1;border-radius:50%;background:{{ p.text }};bottom:-14%;left:16%;display:flex;align-items:center;justify-content:center;">
                        <div style="width:40%;aspect-ratio:1;border-radius:50%;background:{{ p.bg2 }};"></div>
                      </div>
                      <div style="position:absolute;width:clamp(24px,3.2vw,34px);aspect-ratio:1;border-radius:50%;background:{{ p.text }};bottom:-14%;right:16%;display:flex;align-items:center;justify-content:center;">
                        <div style="width:40%;aspect-ratio:1;border-radius:50%;background:{{ p.bg2 }};"></div>
                      </div>
                    </div>
                  </sc-if>
                  <sc-if value="{{ opt.isBird }}" hint-placeholder-val="{{ false }}">
                    <div style="position:relative;width:clamp(150px,18vw,200px);height:clamp(118px,14vw,158px);">
                      <div style="position:absolute;left:12%;right:28%;top:32%;bottom:8%;background:{{ opt.color }};border-radius:50% 50% 45% 45%;"></div>
                      <div style="position:absolute;left:20%;top:40%;width:50%;height:34%;background:{{ opt.color }};opacity:0.55;border-radius:50% 50% 50% 15%;transform:rotate(-12deg);"></div>
                      <div style="position:absolute;width:36%;aspect-ratio:1;background:{{ opt.color }};border-radius:50%;top:2%;right:6%;"></div>
                      <div style="position:absolute;width:16%;height:12%;right:-8%;top:16%;background:{{ p.text }};clip-path:polygon(0 0,100% 50%,0 100%);"></div>
                      <div style="position:absolute;width:9%;aspect-ratio:1;border-radius:50%;background:{{ p.text }};top:10%;right:18%;display:flex;align-items:center;justify-content:center;">
                        <div style="width:40%;aspect-ratio:1;border-radius:50%;background:{{ p.bg2 }};"></div>
                      </div>
                      <div style="position:absolute;width:22%;height:16%;left:-6%;bottom:22%;background:{{ opt.color }};clip-path:polygon(100% 0,0 50%,100% 100%);"></div>
                    </div>
                  </sc-if>
                  <sc-if value="{{ opt.isBoat }}" hint-placeholder-val="{{ false }}">
                    <div style="position:relative;width:clamp(150px,18vw,200px);height:clamp(118px,14vw,158px);">
                      <div style="position:absolute;left:10%;right:10%;bottom:8%;height:24%;background:{{ opt.color }};clip-path:polygon(12% 0%,88% 0%,72% 100%,28% 100%);"></div>
                      <div style="position:absolute;left:47%;width:5%;bottom:30%;height:56%;background:{{ p.text }};border-radius:2px;"></div>
                      <div style="position:absolute;left:50%;width:38%;bottom:32%;height:48%;background:{{ opt.color }};clip-path:polygon(0% 0%,100% 32%,0% 100%);"></div>
                    </div>
                  </sc-if>
                  <div style="font-size:clamp(24px,2.8vw,30px);font-weight:700;">{{ opt.label }}</div>
                </button>
              </sc-for>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ isQ2 }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;flex-direction:column;align-items:center;gap:clamp(24px,4vh,40px);">
            <div style="font-size:clamp(28px,4vw,42px);font-weight:700;text-align:center;">¿Dónde apareció la señal?</div>
            <div style="position:relative;width:min(70vw,60vh,520px);aspect-ratio:1;">
              <div style="position:absolute;inset:0;border-radius:50%;border:5px solid {{ p.line }};background:{{ p.bg2 }};"></div>
              <sc-for list="{{ zonesQ2 }}" as="z" hint-placeholder-count="6">
                <button onClick="{{ z.onClick }}" style="position:absolute;inset:0;width:100%;height:100%;background:transparent;border:none;cursor:pointer;clip-path:{{ z.clip }};" style-hover="background:{{ p.primary }};opacity:0.35;"></button>
              </sc-for>
              <div style="position:absolute;left:50%;top:0;bottom:0;width:3px;background:{{ p.line }};transform:translateX(-50%);pointer-events:none;"></div>
              <div style="position:absolute;left:50%;top:0;bottom:0;width:3px;background:{{ p.line }};transform:translateX(-50%) rotate(60deg);pointer-events:none;"></div>
              <div style="position:absolute;left:50%;top:0;bottom:0;width:3px;background:{{ p.line }};transform:translateX(-50%) rotate(120deg);pointer-events:none;"></div>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ isFeedback }}" hint-placeholder-val="{{ false }}">
          <div style="background:{{ feedbackColor }};color:{{ p.primaryText }};padding:clamp(36px,5vw,56px) clamp(48px,7vw,80px);border-radius:32px;font-size:clamp(36px,5vw,54px);font-weight:700;text-align:center;">{{ feedbackText }}</div>
        </sc-if>

      </div>
    </div>
  </sc-if>

  <sc-if value="{{ isSummary }}" hint-placeholder-val="{{ false }}">
    <div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(20px,4vh,36px);padding:clamp(24px,5vw,48px);text-align:center;">
      <div style="font-size:clamp(32px,5vw,50px);font-weight:700;">¡Sesión terminada!</div>
      <div style="font-size:clamp(24px,3vw,30px);max-width:600px;opacity:0.9;">{{ summaryMessage }}</div>
      <div style="display:flex;gap:clamp(6px,1.2vw,12px);">
        <sc-for list="{{ stars }}" as="star" hint-placeholder-count="8">
          <div style="font-size:clamp(30px,4vw,44px);color:{{ star.color }};">{{ star.glyph }}</div>
        </sc-for>
      </div>
      <div style="display:flex;gap:clamp(20px,3vw,32px);flex-wrap:wrap;justify-content:center;margin-top:clamp(12px,2vh,20px);">
        <button onClick="{{ playAgain }}" style="min-width:220px;min-height:80px;height:clamp(80px,9vh,96px);padding:0 clamp(28px,3vw,40px);border-radius:24px;background:{{ p.primary }};color:{{ p.primaryText }};font-size:clamp(24px,2.8vw,30px);font-weight:700;border:none;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,0.16);" style-active="transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,0.16);">Jugar de nuevo</button>
        <button onClick="{{ exitGame }}" style="min-width:220px;min-height:80px;height:clamp(80px,9vh,96px);padding:0 clamp(28px,3vw,40px);border-radius:24px;background:transparent;color:{{ p.text }};font-size:clamp(24px,2.8vw,30px);font-weight:700;border:4px solid {{ p.line }};cursor:pointer;">Volver al inicio</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ isPaused }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;background:oklch(20% 0 0 / 0.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;">
      <div style="background:{{ p.bg }};border-radius:32px;padding:clamp(32px,5vw,56px);display:flex;flex-direction:column;align-items:center;gap:clamp(24px,3.5vh,36px);box-shadow:0 20px 60px rgba(0,0,0,0.3);max-width:90vw;">
        <div style="font-size:clamp(28px,4vw,40px);font-weight:700;">Juego en pausa</div>
        <div style="display:flex;gap:clamp(20px,3vw,32px);flex-wrap:wrap;justify-content:center;">
          <button onClick="{{ resumeGame }}" style="min-width:200px;min-height:72px;height:clamp(72px,9vh,88px);padding:0 clamp(24px,3vw,36px);border-radius:22px;background:{{ p.primary }};color:{{ p.primaryText }};font-size:clamp(22px,2.6vw,28px);font-weight:700;border:none;cursor:pointer;">Continuar</button>
          <button onClick="{{ exitGame }}" style="min-width:200px;min-height:72px;height:clamp(72px,9vh,88px);padding:0 clamp(24px,3vw,36px);border-radius:22px;background:transparent;color:{{ p.text }};font-size:clamp(22px,2.6vw,28px);font-weight:700;border:4px solid {{ p.line }};cursor:pointer;">Salir al inicio</button>
        </div>
      </div>
    </div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 900, &quot;height&quot;: 700},
  &quot;paletteName&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;terracota&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;terracota&quot;, &quot;marino&quot;, &quot;bosque&quot;], &quot;section&quot;: &quot;Apariencia&quot;},
  &quot;roundsPerSession&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 8, &quot;min&quot;: 5, &quot;max&quot;: 12, &quot;step&quot;: 1, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Juego&quot;},
  &quot;progressiveDifficulty&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Juego&quot;}
}">
const PALETTES = {
  terracota: { bg:'oklch(97% 0.015 75)', bg2:'oklch(93% 0.03 68)', text:'oklch(24% 0.03 50)', primary:'oklch(46% 0.17 40)', primaryText:'oklch(99% 0.005 90)', car1:'oklch(52% 0.19 25)', car2:'oklch(46% 0.13 250)', bird1:'oklch(60% 0.15 95)', bird2:'oklch(46% 0.12 195)', boat1:'oklch(55% 0.18 55)', boat2:'oklch(48% 0.16 330)', good:'oklch(40% 0.12 145)', warn:'oklch(46% 0.13 85)', signal:'oklch(45% 0.16 300)', line:'oklch(58% 0.04 60)' },
  marino: { bg:'oklch(96% 0.018 75)', bg2:'oklch(92% 0.025 70)', text:'oklch(22% 0.03 250)', primary:'oklch(28% 0.09 255)', primaryText:'oklch(98% 0.01 90)', car1:'oklch(50% 0.19 25)', car2:'oklch(38% 0.13 250)', bird1:'oklch(60% 0.15 95)', bird2:'oklch(46% 0.12 195)', boat1:'oklch(55% 0.18 55)', boat2:'oklch(48% 0.16 330)', good:'oklch(38% 0.10 150)', warn:'oklch(45% 0.12 80)', signal:'oklch(42% 0.14 320)', line:'oklch(52% 0.03 250)' },
  bosque: { bg:'oklch(96% 0.02 110)', bg2:'oklch(92% 0.03 105)', text:'oklch(23% 0.03 140)', primary:'oklch(38% 0.11 150)', primaryText:'oklch(98% 0.01 90)', car1:'oklch(52% 0.19 25)', car2:'oklch(45% 0.13 250)', bird1:'oklch(60% 0.15 95)', bird2:'oklch(46% 0.12 195)', boat1:'oklch(55% 0.18 55)', boat2:'oklch(48% 0.16 330)', good:'oklch(38% 0.11 150)', warn:'oklch(46% 0.13 75)', signal:'oklch(44% 0.15 30)', line:'oklch(52% 0.03 130)' },
};

const SECTOR_CLIPS = [
  'polygon(50% 50%, 50% 0%, 93.3% 25%)',
  'polygon(50% 50%, 93.3% 25%, 93.3% 75%)',
  'polygon(50% 50%, 93.3% 75%, 50% 100%)',
  'polygon(50% 50%, 50% 100%, 6.7% 75%)',
  'polygon(50% 50%, 6.7% 75%, 6.7% 25%)',
  'polygon(50% 50%, 6.7% 25%, 50% 0%)',
];
const SECTOR_CENTERS = [
  { left: 68.75, top: 17.5 },
  { left: 87.5, top: 50 },
  { left: 68.75, top: 82.5 },
  { left: 31.25, top: 82.5 },
  { left: 12.5, top: 50 },
  { left: 31.25, top: 17.5 },
];

class Component extends DCLogic {
  state = {
    screen: 'home',
    paused: false,
    round: 0,
    totalRounds: this.props.roundsPerSession || 8,
    objectType: 'car',
    variant: null,
    signalZone: null,
    q1Answer: null,
    q2Answer: null,
    results: [],
    feedbackGood: true,
  };

  timers = [];

  clearTimers() {
    this.timers.forEach(t => clearTimeout(t));
    this.timers = [];
  }

  componentWillUnmount() {
    this.clearTimers();
  }

  roundDuration(n, totalRounds) {
    const progressive = this.props.progressiveDifficulty ?? true;
    if (!progressive) return 2000;
    const step = totalRounds > 1 ? (2400 - 1400) / (totalRounds - 1) : 0;
    return Math.round(2400 - (n - 1) * step);
  }

  startGame = () => {
    const totalRounds = this.props.roundsPerSession || 8;
    this.setState({ results: [], totalRounds }, () => this.playRound(1));
  };

  playAgain = () => {
    const totalRounds = this.props.roundsPerSession || 8;
    this.setState({ results: [], totalRounds, paused: false }, () => this.playRound(1));
  };

  playRound(n) {
    const totalRounds = this.state.totalRounds;
    const tier = Math.ceil(totalRounds / 3);
    const objectType = n <= tier ? 'car' : (n <= tier * 2 ? 'bird' : 'boat');
    const variant = objectType === 'car'
      ? (Math.random() < 0.5 ? 'rojo' : 'azul')
      : objectType === 'bird'
      ? (Math.random() < 0.5 ? 'amarillo' : 'verde')
      : (Math.random() < 0.5 ? 'naranja' : 'morado');
    const zone = Math.floor(Math.random() * 6);
    this.setState({ screen: 'stimulus', round: n, objectType, variant, signalZone: zone, q1Answer: null, q2Answer: null });
    const duration = this.roundDuration(n, this.state.totalRounds);
    const t1 = setTimeout(() => {
      if (this.state.paused) return;
      this.setState({ screen: 'blank' });
      const t2 = setTimeout(() => {
        if (!this.state.paused) this.setState({ screen: 'q1' });
      }, 500);
      this.timers.push(t2);
    }, duration);
    this.timers.push(t1);
  }

  answerQ1 = (choice) => {
    this.setState({ q1Answer: choice, screen: 'q2' });
  };

  answerQ2 = (zone) => {
    const carCorrect = this.state.q1Answer === this.state.variant;
    const zoneCorrect = zone === this.state.signalZone;
    const results = [...this.state.results, { carCorrect, zoneCorrect }];
    const round = this.state.round;
    const totalRounds = this.state.totalRounds;
    this.setState({ q2Answer: zone, results, screen: 'feedback', feedbackGood: carCorrect && zoneCorrect });
    const t = setTimeout(() => {
      if (this.state.paused) return;
      if (round >= totalRounds) this.setState({ screen: 'summary' });
      else this.playRound(round + 1);
    }, 1800);
    this.timers.push(t);
  };

  pauseGame = () => {
    this.clearTimers();
    this.setState({ paused: true });
  };

  resumeGame = () => {
    const screen = this.state.screen;
    this.setState({ paused: false }, () => {
      if (screen === 'stimulus' || screen === 'blank') {
        this.playRound(this.state.round);
      } else if (screen === 'feedback') {
        const round = this.state.round, totalRounds = this.state.totalRounds;
        const t = setTimeout(() => {
          if (round >= totalRounds) this.setState({ screen: 'summary' });
          else this.playRound(round + 1);
        }, 1200);
        this.timers.push(t);
      }
    });
  };

  exitGame = () => {
    this.clearTimers();
    this.setState({ screen: 'home', paused: false, round: 0, results: [] });
  };

  renderVals() {
    const s = this.state;
    const p = PALETTES[this.props.paletteName] || PALETTES.terracota;
    const isHome = s.screen === 'home';
    const isSummary = s.screen === 'summary';
    const inGameScreens = ['stimulus', 'blank', 'q1', 'q2', 'feedback'];
    const isGame = inGameScreens.includes(s.screen);
    const isStimulus = s.screen === 'stimulus';
    const isBlank = s.screen === 'blank';
    const isStimOrBlank = isStimulus || isBlank;
    const isQ1 = s.screen === 'q1';
    const isQ2 = s.screen === 'q2';
    const isFeedback = s.screen === 'feedback';

    const completed = s.results.length;
    const segments = Array.from({ length: s.totalRounds }, (_, i) => ({
      i, color: i < completed ? p.primary : 'transparent',
    }));

    const signalPos = SECTOR_CENTERS[s.signalZone] || SECTOR_CENTERS[0];
    const zonesQ2 = Array.from({ length: 6 }, (_, i) => ({ i, onClick: () => this.answerQ2(i), clip: SECTOR_CLIPS[i] }));

    const isCarType = s.objectType === 'car';
    const isBirdType = s.objectType === 'bird';
    const isBoatType = s.objectType === 'boat';
    const showCar = isStimulus && isCarType;
    const showBird = isStimulus && isBirdType;
    const showBoat = isStimulus && isBoatType;
    const question1Text = isCarType ? '¿Qué carro viste?' : isBirdType ? '¿Qué pájaro viste?' : '¿Qué barco viste?';
    const q1Options = isCarType ? [
      { key: 'rojo', color: p.car1, label: 'Rojo', isCar: true, isBird: false, isBoat: false, onClick: () => this.answerQ1('rojo') },
      { key: 'azul', color: p.car2, label: 'Azul', isCar: true, isBird: false, isBoat: false, onClick: () => this.answerQ1('azul') },
    ] : isBirdType ? [
      { key: 'amarillo', color: p.bird1, label: 'Amarillo', isCar: false, isBird: true, isBoat: false, onClick: () => this.answerQ1('amarillo') },
      { key: 'verde', color: p.bird2, label: 'Verde', isCar: false, isBird: true, isBoat: false, onClick: () => this.answerQ1('verde') },
    ] : [
      { key: 'naranja', color: p.boat1, label: 'Naranja', isCar: false, isBird: false, isBoat: true, onClick: () => this.answerQ1('naranja') },
      { key: 'morado', color: p.boat2, label: 'Morado', isCar: false, isBird: false, isBoat: true, onClick: () => this.answerQ1('morado') },
    ];

    const carColor = s.variant === 'rojo' ? p.car1 : p.car2;
    const birdColor = s.variant === 'amarillo' ? p.bird1 : p.bird2;
    const boatColor = s.variant === 'naranja' ? p.boat1 : p.boat2;
    const feedbackColor = s.feedbackGood ? p.good : p.warn;
    const feedbackText = s.feedbackGood ? '¡Muy bien!' : 'Casi, ¡sigue así!';

    const fullCorrect = s.results.filter(r => r.carCorrect && r.zoneCorrect).length;
    const stars = Array.from({ length: s.totalRounds }, (_, i) => ({
      i, glyph: i < fullCorrect ? '★' : '☆', color: i < fullCorrect ? p.primary : p.line,
    }));
    const summaryMessage = fullCorrect >= s.totalRounds * 0.6
      ? 'Lo hiciste muy bien. Tu atención está en gran forma.'
      : '¡Buen intento! Cada práctica ayuda a tu mente.';

    return {
      p, isHome, isGame, isStimulus, isBlank, isStimOrBlank, isQ1, isQ2, isFeedback, isSummary,
      isPaused: s.paused, showCar, showBird, showBoat, question1Text, q1Options,
      segments, signalPos, zonesQ2, carColor, birdColor, boatColor, feedbackColor, feedbackText,
      stars, summaryMessage,
      startGame: this.startGame, playAgain: this.playAgain, exitGame: this.exitGame,
      pauseGame: this.pauseGame, resumeGame: this.resumeGame,
    };
  }
}

</script>
